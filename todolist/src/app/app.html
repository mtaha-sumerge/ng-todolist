<div class="wrapper">
  <div class="dashboard">
    <!-- Search bar-->
    <section class="search-task">
      <input type="text" placeholder="Search for a task" id="search-input" (input)="searchTask($event)">
    </section>

    <div class="container my-4">
      <div class="row g-4">
        <div class="col-md-6">
          <app-pending-tasks [searchQuery]="query" />
        </div>
        <div class="col-md-6">
          <app-completed-tasks [searchQuery]="query" />
        </div>
      </div>
    </div>


    <div class="row g-4">
      <!-- Add task bar-->
      <section class="search-task">
        <input type="text" placeholder="Add a task" #taskInput>
        <button id="add" class="btn btn-outline-primary" (click)="addTask(taskInput.value); taskInput.value = ''">Add</button>
      </section>
    </div>

  </div>

</div>
